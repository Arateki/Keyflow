name: Mutation
# Teste de mutação (PIT, tarefa :app:pitest em app/build.gradle.kts): muda a lógica pura de propósito e roda os testes de
# unidade contra cada mudança; o resumo do job lista por classe quanto os testes percebem e cada mutante que sobreviveu.
# Não bloqueia PR e não faz parte da regra da main — é mapa de onde os testes são fracos, para ler de tempos em tempos.
#
# Rodar: toda segunda de manhã sozinho, ou Actions → Mutation → Run workflow (com alvos próprios, se quiser).
# Também por push numa branch `ci/mutacao…`, para medir uma mudança antes de mesclar.
on:
  schedule:
    - cron: '0 9 * * 1'
  push:
    branches: ['ci/mutacao**']
  workflow_dispatch:
    inputs:
      targets:
        description: Classes do PIT, separadas por vírgula (ex. com.keyflow.overlay.*); vazio = os alvos padrão do build
        default: ''
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pitest:
    name: Mutation (PIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # O mesmo preparo do job de unidade do checks.yml (caminho do JDK e keystore de debug fixos no build).
      - name: JDK path and debug keystore
        run: |
          sudo ln -sfn "$JAVA_HOME" /usr/lib/jvm/java-17-openjdk
          mkdir -p ~/.config/.android
          keytool -genkeypair -keystore ~/.config/.android/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: sherpa-onnx AAR version
        id: sherpa
        run: |
          version=$(sed -n 's/^val sherpaOnnxVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          sha=$(sed -n 's/^val sherpaOnnxSha256 = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$version" && test -n "$sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/libs/sherpa-onnx-${{ steps.sherpa.outputs.version }}.aar
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-${{ steps.sherpa.outputs.sha }}
      - name: Mutation testing
        env:
          TARGETS: ${{ inputs.targets }}
        run: ./gradlew --no-daemon :app:pitest ${TARGETS:+"-PpitTargets=$TARGETS"}
      - name: Mutation summary
        run: python3 scripts/mutation-summary.py app/build/reports/pitest/mutations.xml
      - name: Mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: app/build/reports/pitest/
          if-no-files-found: warn
          retention-days: 30
