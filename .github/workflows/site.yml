name: site

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/loja/**"
      - "scripts/gerar-site.py"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/loja/**"
      - "scripts/gerar-site.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Gerar e publicar site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Montar e validar o site (website/ + páginas legais)
        run: python3 scripts/gerar-site.py

      - name: Publicar site no Cloudflare R2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_SITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SITE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_SITE_ENDPOINT }}
        # Um sync por extensão, cada um com o content-type certo (a tabela TIPOS do gerar-site.py; o HTML vai
        # por último). O --delete de cada passada só apaga, no bucket, arquivos daquela extensão que saíram do site.
        run: |
          set -euo pipefail
          python3 scripts/gerar-site.py --tipos | while IFS=$'\t' read -r ext tipo cache; do
            echo "Publicando *.$ext como $tipo"
            aws s3 sync build/site s3://keyflow-site \
              --endpoint-url "$R2_ENDPOINT" \
              --delete \
              --exclude "*" \
              --include "*.$ext" \
              --content-type "$tipo" \
              --cache-control "$cache" < /dev/null
          done
