name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
  # Os jobs do emulador baixam os APKs desta rodada com ela ainda em curso (`gh run download`) e
  # consultam o estado do job de unitários — ver scripts/ci-device-gate.sh.
  actions: read
# Um push novo no mesmo PR cancela a rodada anterior: o job de device leva dezenas de minutos e o
# repositório é privado (minutos contam).
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    # scripts/ci-device-gate.sh procura este nome para saber se o job falhou.
    name: Unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # gradle.properties fixa org.gradle.java.home no caminho da máquina do Yan; o runner aponta o
      # mesmo caminho para o JDK 17 instalado acima em vez de mexer no arquivo versionado.
      # app/build.gradle.kts assina o debug com a keystore de ~/.config/.android (caminho fixo).
      - name: JDK path and debug keystore
        run: |
          sudo ln -sfn "$JAVA_HOME" /usr/lib/jvm/java-17-openjdk
          mkdir -p ~/.config/.android
          keytool -genkeypair -keystore ~/.config/.android/debug.keystore -storepass android \
            -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # app/build.gradle.kts baixa o AAR do sherpa-onnx (~50 MB) do release do GitHub quando ele falta
      # em app/libs/ (ignorado no git). Sem cache, todo job baixava de novo: em 2026-10-03 o GitHub
      # respondeu 503 e derrubou a PR #7 antes de qualquer teste. A chave é a versão e o SHA256 fixados
      # no build — subir o sherpa troca a chave sozinho.
      - name: sherpa-onnx AAR version
        id: sherpa
        run: |
          version=$(sed -n 's/^val sherpaOnnxVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          sha=$(sed -n 's/^val sherpaOnnxSha256 = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$version" && test -n "$sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/libs/sherpa-onnx-${{ steps.sherpa.outputs.version }}.aar
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-${{ steps.sherpa.outputs.sha }}
      - name: Unit tests and APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      # Os jobs do emulador não compilam: instalam estes APKs. Sobem antes do resto para eles saírem
      # da espera o quanto antes. APK já é comprimido (compression-level 0); 1 dia de retenção porque só
      # servem a esta rodada, e o armazenamento conta na cota do plano.
      - name: APKs for the emulator jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
      # STO-02: código nativo pronto para páginas de 16 KB (requisito do Play). Os .so do release são os
      # mesmos do debug (só menos ABIs).
      - name: 16 KB alignment of native libraries
        run: python3 scripts/check-16kb-alignment.py app/build/outputs/apk/debug/app-debug.apk
      - name: Unit test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-evidence
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  device:
    # Sem `needs: unit`: o preparo e o boot do emulador (~3 min) correm enquanto o `unit` compila, e o
    # script espera o artefato `apks` (se o `unit` falhar, ele para logo). Em 2026-10-07 o gate num
    # emulador só passou de 70 min — suíte de 584 testes (~38 min) + galeria de 216 PNGs, depois de
    # recompilar o app no próprio runner — e o QEMU travou no fim. Agora cada job roda 1/N da suíte e,
    # no mesmo emulador, 1/N das rotas da galeria (claro e escuro): um emulador por pedaço, não dois.
    # Mudar o nº de pedaços = mexer na lista `shard` (o total vem de strategy.job-total).
    name: Device (API 34, ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Só para o sdkmanager/avdmanager do emulator-runner: aqui não há Gradle.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # O AVD pede ~7,2 GB livres só para a partição de dados. Medido em 2026-09-24: 7,1 GB livres na
      # imagem → emulador abortou antes do boot. Tira toolchains que o projeto não usa (o SDK Android
      # fica); o `df` antes/depois fica no log.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/julia*
          df -h /
      # Sem KVM o emulador cai para emulação por software (TCG) e a suíte vira horas de timeouts —
      # medido no sandbox da nuvem em 2026-09-24. Aqui KVM é requisito: falta dele é falha.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      # `compare` do diff-screens.sh.
      - name: ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      # Mesmo AVD da referência local (Pixel 6, API 34, google_apis x86_64). Sem -noaudio: os testes
      # de gravação (audio.*, OverlayServiceCancelTest, seletor do mic) precisam de microfone.
      # O timeout do passo é menor que o do job para a evidência subir mesmo se o emulador travar.
      # emulator-build fixo: sem ele o action instala o emulador mais novo, e o 37.2.12 (build 16428233,
      # em uso desde antes de 2026-10-07) vaza ~93 MB do host a cada abertura do app — medido A/B no mesmo
      # AVD em 2026-10-09: 30 aberturas da galeria levaram o QEMU de 3,66 a 6,43 GB no 37.2.12 e de 3,78
      # a 3,98 GB no 37.1.11 (build 15917651, o da última `main` verde). No runner de 7 GB isso virou
      # swap e QEMU travado na galeria. Subir de versão = repetir o A/B antes.
      # -gpu swangle_indirect (ANGLE sobre o SwiftShader Vulkan), não swiftshader_indirect: neste o QEMU
      # caía na RenderThread do host ao desenhar a prévia do Aero (tela de skins: queda na 2ª e na 12ª
      # abertura no emulador local, 2026-10-09; a quick 018 já tinha visto o Aero cair sem achar a causa).
      # No swangle, 0 quedas em 40 aberturas e duas galerias inteiras byte a byte iguais; 36 goldens
      # mudaram só na suavização de borda e foram reaprovados.
      - name: Device gate on the emulator
        id: gate
        # Abaixo do job, para o diff e a evidência subirem mesmo num estouro. O job mais lento levou 28 min
        # sem repetição (2026-10-10); se o processo do app cai cedo, a repetição do script roda quase o
        # shard inteiro de novo.
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          emulator-build: 15917651
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/ci-device-gate.sh all ${{ matrix.shard }} ${{ strategy.job-total }}
      # Roda mesmo com teste falhando na suíte (o passo do gate fica vermelho, mas as capturas existem).
      - name: Diff against the goldens
        if: ${{ !cancelled() && steps.gate.outcome != 'skipped' }}
        env:
          ROUTE_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: scripts/diff-screens.sh
      - name: Device evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-evidence-${{ matrix.shard }}
          path: app/build/ci-evidence/
          if-no-files-found: warn
          retention-days: 14
