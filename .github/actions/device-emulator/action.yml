name: Emulador do gate de device
description: Prepara o Pixel 6 e executa um pedaço do gate, com a configuração única das duas tentativas.
inputs:
  shard:
    description: Índice do pedaço
    required: true
  shards:
    description: Total de pedaços
    required: true
runs:
  using: composite
  steps:
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 34
        emulator-build: 15917651
        target: google_apis
        arch: x86_64
        profile: pixel_6
        cores: 2
        ram-size: 4096M
        disk-size: 6G
        emulator-options: -no-window -gpu swangle_indirect -no-snapshot -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          scripts/ci-emulator-profile.sh
          scripts/ci-device-gate.sh all ${{ inputs.shard }} ${{ inputs.shards }}
