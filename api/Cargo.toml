[package]
name = "keyflow-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.0"
futures-util = "0.3.32"
governor = "0.10.4"
hmac = "0.13.0"
ipnet = "2.11"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
p256 = "0.13.2"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["form", "json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.23.4", features = ["v4"] }

# Perfil para a máquina de 0,5 GB. Sem `panic = "abort"`: o backtrace do único processo
# ajuda a achar a causa de um panic; abort só economizaria a tabela de unwinding.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
