services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: keyflow
      POSTGRES_PASSWORD: keyflow
      POSTGRES_DB: keyflow_api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyflow -d keyflow_api"]
      interval: 2s
      timeout: 2s
      retries: 15
